name = "barhopoly"
main = "src/worker.js"
compatibility_date = "2025-09-01"
# Serve the game at barhopoly.<your-subdomain>.workers.dev
workers_dev = true

# The game page and its scripts
[assets]
directory = "./public"
binding = "ASSETS"

# One live room per hosted game, plus one for the boards
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
